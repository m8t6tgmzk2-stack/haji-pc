<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="حاسوب الحجي"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"></head><body><title>حاسوب الحجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Lalezar&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Concept: a black desk-world. Your photo sits at the bottom of every wallpaper; each computer re-skins the chrome (bar, windows, accent) around it. */
:root{
  --ink:#05070d; --panel:#0e131f; --panel2:#151c2e; --line:#252e47; --text:#e9edf8; --mute:#8b95b3;
  --acc:#3b82f6; --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  --ui:'Cairo',system-ui,sans-serif; --display:'Lalezar','Cairo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --topH:0px; --botH:48px; --leftW:0px; --wr:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--ui);overflow:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
.scr{position:absolute;inset:0}

/* ---------- picker ---------- */
#pick{overflow:auto;background:linear-gradient(#05070dcc,#05070df5 70%),var(--bgp,none) 72% 20%/cover,var(--ink)}
.pwrap{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.phead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ava{width:96px;height:96px;border-radius:50%;border:3px solid var(--acc);box-shadow:0 0 0 6px #3b82f622,0 10px 40px #3b82f655;object-fit:cover;background:#000}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1;margin:0;text-wrap:balance}
.phead p{margin:6px 0 0;color:var(--mute);font-size:16px}
.xpb{margin-inline-start:auto;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.bar2{height:8px;background:#ffffff14;border-radius:9px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc);border-radius:9px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;text-align:start;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c)}
.mini{height:104px;border-radius:10px;position:relative;overflow:hidden;background:radial-gradient(60% 90% at 50% 120%,var(--c),#02030a 70%);border:1px solid #ffffff14}
.mini::before,.mini::after{content:"";position:absolute;background:#ffffff30}
.mini.win::after,.mini.gam::after,.mini.ret::after{left:0;right:0;bottom:0;height:12px}
.mini.mac::before{left:0;right:0;top:0;height:8px}.mini.mac::after{left:25%;right:25%;bottom:6px;height:14px;border-radius:8px}
.mini.lin::before{left:0;right:0;top:0;height:8px}.mini.lin::after{left:0;top:8px;bottom:0;width:14px}
.mini.gam::after{background:var(--c);box-shadow:0 0 14px var(--c)}
.mini.ret{background:repeating-linear-gradient(0deg,#031a0a 0 2px,#05260f 2px 4px)}.mini.ret::after{background:var(--c)}
.mini span{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;opacity:.9}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.card .k{color:var(--c);font-size:13px;font-weight:700}
.spec{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;color:var(--mute);margin:0}
.spec dt{color:var(--mute)}.spec dd{margin:0;color:var(--text);font-family:var(--mono);font-size:12px;direction:ltr;text-align:end}
.go{margin-top:auto;background:var(--c);color:#04101f;border:0;border-radius:10px;padding:9px;font-weight:700}

/* ---------- boot / login ---------- */
#boot,#login{background:#000;display:grid;place-items:center;z-index:50;text-align:center}
.boot .bl{font-size:70px;line-height:1;color:var(--acc)}
.boot h2{font-family:var(--display);font-weight:400;font-size:34px;margin:10px 0 18px}
.bp{width:min(280px,70vw);height:6px;background:#ffffff1f;border-radius:6px;overflow:hidden;margin:0 auto}.bp i{display:block;height:100%;width:0;background:var(--acc)}
.boot p{color:var(--mute);font-family:var(--mono);font-size:12px;direction:ltr}
.boot.ret{align-items:start;justify-items:start;padding:24px;font-family:var(--mono);color:#3dff7a;text-align:left;direction:ltr}
.boot.ret div{white-space:pre}
#login{background:linear-gradient(#0007,#000c),var(--bgp,none) 72% 36%/cover,#02030a}
#login .ava{width:150px;height:150px}
#login h2{font-family:var(--display);font-weight:400;font-size:44px;margin:14px 0 4px}
#login button{margin-top:18px;background:var(--acc);color:#04101f;border:0;border-radius:999px;padding:10px 34px;font-weight:700;font-size:16px}

/* ---------- desktop ---------- */
#pc{background:#000;overflow:hidden}
#wall{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 90%,color-mix(in srgb,var(--acc) 50%,#000),#02030a 72%);background-size:cover}
#wallimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 36%;pointer-events:none;user-select:none}
#wallimg.circ{inset:auto;bottom:0;left:50%;transform:translateX(-50%);height:min(90%,100vw);width:auto;aspect-ratio:1;object-fit:fill;mix-blend-mode:lighten}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#000b);pointer-events:none}
#desk{direction:ltr;position:absolute;left:var(--leftW);right:0;top:var(--topH);bottom:var(--botH);padding:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.di{width:82px;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:8px;font-size:12px;text-shadow:0 1px 4px #000}
.di:hover{background:#ffffff1f}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--t,#334);box-shadow:0 4px 12px #0006,inset 0 1px #ffffff40;flex:none}
#wins{position:absolute;inset:0;pointer-events:none}#wins>*{pointer-events:auto}
.w{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--wr);box-shadow:0 18px 50px #000b;resize:both;overflow:hidden;min-width:280px;min-height:170px;max-width:100%}
.w.on{border-color:color-mix(in srgb,var(--acc) 65%,var(--line));box-shadow:0 22px 60px #000d,0 0 0 1px color-mix(in srgb,var(--acc) 35%,transparent)}
.w.min{display:none}
.w.max{left:var(--leftW)!important;top:var(--topH)!important;width:calc(100% - var(--leftW))!important;height:calc(100% - var(--topH) - var(--botH))!important;border-radius:0;resize:none}
.tb{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--panel2);cursor:grab;user-select:none;touch-action:none;flex:none}
.tb .ic{font-size:15px}.tb .ttl{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbb{display:flex;gap:2px}.tbb button{width:30px;height:24px;border:0;background:transparent;border-radius:6px}
.tbb button:hover{background:#ffffff1f}.tbb .x:hover{background:#e5484d}
.wb{flex:1;min-height:0;overflow:auto;position:relative;outline:0}
#bar{position:absolute;z-index:30;display:flex;align-items:center;gap:4px;background:#0b101cd9;backdrop-filter:blur(14px);border-top:1px solid var(--line);left:0;right:0;bottom:0;height:var(--botH);padding:0 8px}
#bar .ab{position:relative;width:42px;height:38px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;font-size:21px;flex:none}
#bar .ab:hover{background:#ffffff1f}
#bar .ab.run::after{content:"";position:absolute;bottom:2px;width:14px;height:3px;border-radius:3px;background:#ffffff66}
#bar .ab.act::after{background:var(--acc);width:20px}
#bar .st{width:auto;padding:0 12px;gap:8px;display:flex;align-items:center;font-weight:700;font-size:14px}
#bar .st b{color:var(--acc);font-size:18px}
#tray{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#tray button,#top button{border:0;background:transparent;border-radius:6px;padding:3px 7px}#tray button:hover,#top button:hover{background:#ffffff1f}
#top{position:absolute;z-index:31;left:0;right:0;top:0;height:var(--topH);display:none;align-items:center;gap:10px;padding:0 12px;background:#080b14e6;backdrop-filter:blur(14px);font-size:13px;font-weight:600}
#top .clk{margin-inline-start:auto;font-variant-numeric:tabular-nums}
#pc.mac #top,#pc.lin #top{display:flex}#pc.mac #tray,#pc.lin #tray{display:none}
#pc.mac{--topH:28px;--botH:84px;--wr:12px}
#pc.mac #bar{left:50%;right:auto;transform:translateX(-50%);bottom:8px;height:64px;border:1px solid #ffffff30;border-radius:20px;padding:0 10px;background:#ffffff1f}
#pc.mac #bar .ab{width:50px;height:50px;font-size:26px}
#pc.mac .tbb{order:-1;flex-direction:row-reverse;gap:7px}
#pc.mac .tbb button{width:13px;height:13px;border-radius:50%;padding:0;font-size:0}
#pc.mac .tbb .mn{background:#febc2e}#pc.mac .tbb .mx{background:#28c840}#pc.mac .tbb .x{background:#ff5f57}
#pc.mac .tb{background:#1a2133}#pc.mac .ttl{text-align:center}
#pc.lin{--topH:30px;--botH:0px;--leftW:62px;--wr:10px}
#pc.lin #top{background:#1d0a2b}
#pc.lin #bar{top:var(--topH);bottom:0;right:auto;width:var(--leftW);height:auto;flex-direction:column;border:0;border-right:1px solid #ffffff1a;background:#2a1138e8;padding:8px 0}
#pc.lin #bar .ab{width:46px;height:46px}
#pc.lin #bar .st{padding:0;width:46px;height:46px;justify-content:center;order:99;margin-top:auto}#pc.lin #bar .st span{display:none}
#pc.gam{--wr:6px}
#pc.gam #bar{background:#070a12ee;border-top:2px solid var(--acc);box-shadow:0 -4px 24px color-mix(in srgb,var(--acc) 50%,transparent);animation:rgb 8s linear infinite}
#pc.gam .w.on{animation:rgb 8s linear infinite}
@keyframes rgb{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
#pc.ret{--wr:0px;font-family:var(--mono);--panel:#031a0a;--panel2:#052b12;--line:#17803a;--text:#9dffb8;--mute:#4fbf74;--ink:#000}
#pc.ret #wall{filter:grayscale(1) sepia(1) hue-rotate(50deg) saturate(2.4) brightness(.8)}
#pc.ret .w{border:2px solid var(--acc);box-shadow:4px 4px 0 #000}#pc.ret .tb{background:var(--acc);color:#001a08}#pc.ret .tbb button{color:#001a08}
#pc.ret #bar{background:#031a0a;border-top:2px solid var(--acc)}
#pc.ret::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:80;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000002e 2px 3px)}
#menu{position:absolute;left:var(--leftW);right:0;top:var(--topH);bottom:var(--botH);z-index:40;display:grid;place-items:center;background:#0009;backdrop-filter:blur(8px);padding:12px}
#menu .mp{width:min(640px,100%);max-height:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.ms{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.ms input{flex:1;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}.chip.on{background:var(--acc);color:#04101f;border-color:var(--acc);font-weight:700}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px;padding:6px 12px;overflow:auto;flex:1;min-height:120px}
.mg button{background:transparent;border:0;border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}.mg button:hover{background:#ffffff14}
.mf{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf img{width:38px;height:38px;border-radius:50%;object-fit:cover}.mf .who{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.mf button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:13px}.mf button:hover{border-color:var(--acc)}
#toasts{position:absolute;z-index:60;left:12px;bottom:calc(var(--botH) + 12px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;font-size:13px;animation:tin .25s;box-shadow:0 8px 24px #000a}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- app internals ---------- */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#04101f;font-weight:700}
.in{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px}
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px;background:#0a0e18}
.seg{display:flex;gap:4px}.seg button{flex:1;border:0;background:var(--panel2);padding:5px;border-radius:7px;font-size:13px}.seg .on{background:var(--acc);color:#04101f;font-weight:700}
.cd{background:#000;border-radius:10px;padding:8px 12px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cd small{color:var(--mute);font-family:var(--mono);height:18px;overflow:hidden}.cv{font-family:var(--mono);font-size:30px;overflow-x:auto;white-space:nowrap}
.ck,.sci{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}.sci{grid-template-columns:repeat(5,1fr);flex:none}
.ck button,.sci button{background:var(--panel2);border:0;border-radius:9px;font-size:18px;min-height:38px;font-family:var(--mono)}.ck button:hover,.sci button:hover{filter:brightness(1.3)}
.ck .op{background:#22304f}.ck .eq{background:var(--acc);color:#04101f;font-weight:700}.sci button{font-size:13px;min-height:30px}
.conv{display:flex;flex-direction:column;gap:10px;padding:6px 0}.conv .in{width:100%;font-size:18px}
.np{display:flex;flex-direction:column;height:100%}.np textarea{flex:1;resize:none;background:#0a0e18;border:0;padding:12px;font-size:15px;line-height:1.7;outline:0}
.stt{color:var(--mute);font-size:12px;margin-inline-start:auto}
.term{display:flex;flex-direction:column;height:100%;background:#05080f;font-family:var(--mono);font-size:13px;padding:10px;gap:4px}
.to{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.5}.to .e{color:var(--bad)}.to .c{color:var(--acc)}.to .g{color:var(--good)}
.tl{display:flex;gap:8px}.tl .pr{color:var(--good);white-space:nowrap}.tl input{flex:1;background:transparent;border:0;outline:0;font-family:var(--mono);min-width:0}
.fm{display:flex;flex-direction:column;height:100%}.fl{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:10px;align-content:start}
.fi{background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;word-break:break-all}.fi .big{font-size:34px}.fi.sel{background:#ffffff14;border-color:var(--acc)}
.pt{display:flex;flex-direction:column;height:100%}.pt canvas{background:#fff;touch-action:none;cursor:crosshair;max-width:none}.pcv{flex:1;overflow:auto;background:#222}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--panel2)}.tools .btn.on{background:var(--acc);color:#04101f}.tools input[type=color]{width:34px;height:30px;padding:0;border:0;background:none}
.mus{display:flex;flex-direction:column;gap:10px;padding:14px;height:100%}.mus canvas{width:100%;height:110px;background:#000;border-radius:10px}
.tr{display:flex;flex-direction:column;gap:2px}.tr button{text-align:start;background:transparent;border:0;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between}.tr .on{background:#ffffff14;color:var(--acc);font-weight:700}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center}.ctl .btn{font-size:20px;padding:6px 16px}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:8px;border:0;background:transparent;border-bottom:2px solid transparent}.tabs .on{border-color:var(--acc);color:var(--acc);font-weight:700}
.big{font-family:var(--mono)}.clockbig{font-family:var(--mono);font-size:44px;text-align:center;padding:20px 0 4px;font-variant-numeric:tabular-nums;direction:ltr}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.cal{padding:12px;display:flex;flex-direction:column;gap:8px;height:100%}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}.cg div{display:grid;place-items:center;border-radius:8px;background:var(--panel2);min-height:34px}.cg .h{background:transparent;color:var(--mute);font-size:12px}.cg .today{background:var(--acc);color:#04101f;font-weight:700}.cg .o{opacity:.25}
.tm table{width:100%;border-collapse:collapse;font-size:13px}.tm td,.tm th{padding:6px 10px;text-align:start;border-bottom:1px solid var(--line)}.tm th{color:var(--mute);font-weight:600}
.meter{height:10px;background:#ffffff14;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc);transition:width .5s}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.sg button{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px}.sg .on{border-color:var(--acc)}
.sw{width:100%;aspect-ratio:1.4;border-radius:8px;background-size:cover;background-position:center bottom;background-color:#000}
.code{display:flex;flex-direction:column;height:100%;direction:ltr}.code textarea{flex:1;resize:none;background:#070a12;border:0;font-family:var(--mono);font-size:13px;padding:10px;outline:0;tab-size:2;min-height:120px}.code pre{margin:0;height:34%;overflow:auto;background:#000;padding:8px 10px;font-family:var(--mono);font-size:12px;color:var(--good);white-space:pre-wrap;border-top:1px solid var(--line)}
.word{display:flex;flex-direction:column;height:100%}.paper{flex:1;overflow:auto;background:#2a3044;padding:18px}.paper div{background:#fff;color:#111;min-height:100%;max-width:720px;margin:0 auto;padding:36px;outline:0;line-height:1.8;font-size:16px}
.sh{height:100%;overflow:auto;direction:ltr}.sh table{border-collapse:collapse;font-size:13px;font-family:var(--mono)}.sh th{background:var(--panel2);color:var(--mute);font-weight:600;padding:4px 8px;position:sticky;top:0}.sh td{border:1px solid var(--line);padding:0}.sh td input{width:86px;border:0;background:transparent;padding:4px 6px;outline:0}.sh td input:focus{background:#1b2848}
.fx{display:flex;gap:6px;padding:6px;background:var(--panel2);direction:ltr}
.gm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}.gh{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.gm canvas{background:#050912;border:1px solid var(--line);border-radius:8px;max-width:100%;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,48px);gap:4px;direction:ltr}.dp button{height:40px;border:0;background:var(--panel2);border-radius:8px}
.g48{display:grid;grid-template-columns:repeat(4,72px);gap:8px;background:#1b2236;padding:8px;border-radius:10px;touch-action:none;direction:ltr}
.g48 div{height:72px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:26px;background:#2a3350;color:#e9edf8}
.ms9{display:grid;grid-template-columns:repeat(9,32px);gap:2px;direction:ltr}.ms9 button{width:32px;height:32px;border:0;background:#2b3454;border-radius:4px;font-weight:700;padding:0}.ms9 .o{background:#0c1020;cursor:default}
.ttt{display:grid;grid-template-columns:repeat(3,84px);gap:6px;direction:ltr}.ttt button{height:84px;font-size:42px;border:0;background:var(--panel2);border-radius:12px;font-weight:700}

let ac=null,master=null,analyser=null;
function AC(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=st.get('vol',.6);analyser=ac.createAnalyser();analyser.fftSize=128;master.connect(analyser);analyser.connect(ac.destination)}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,d,type='sine',v=.2){const c=AC(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.05)}
function chime(){try{const c=AC();[523,659,784,1047].forEach((f,i)=>tone(f,c.currentTime+i*.12,.5,'sine',.15))}catch(e){}}
